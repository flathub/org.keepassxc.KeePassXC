id: org.keepassxc.KeePassXC
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: keepassxc-wrapper
finish-args:
    # X11 + XShm access
  - --share=ipc
  - --socket=x11
    # Wayland access
  - --socket=wayland
    # Notification access
  - --talk-name=org.freedesktop.Notifications
    # Screen Lock Listener
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.SessionManager.Presence
  - --talk-name=com.canonical.Unity.Session
    # System Tray Icon (Test at every major update)
  - --talk-name=org.kde.StatusNotifierWatcher
    # Secret Service
  - --own-name=org.freedesktop.secrets
    # Favicon Download
  - --share=network
    # YubiKey USB access
  - --device=all
    # Nitrokey Smartcard access
  - --socket=pcsc
    # SSH Agent access
  - --socket=ssh-auth
  - --env=SSH_AUTH_SOCK=$SSH_AUTH_SOCK
    # Host access: workaround extensive portal issues
    # (use beta branch for testing of portals based file access)
  - --filesystem=host
    # Access to temporary files (Remove if RuntimeDirectory patch is upstreamed)
  - --filesystem=/tmp
    # Required for native messaging (Tor browser)
    # TODO uncomment when host access is no longer required.
    # - --filesystem=xdg-data
    # Required for native messaging (Non-Firefox)
    # TODO uncomment when host access is no longer required.
    # - --filesystem=xdg-config
    # Network filesystems
  - --filesystem=xdg-run/gvfs
cleanup:
  - '*.a'
  - '*.h'
  - '*.la'
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
modules:
  - name: keepassxc
    buildsystem: cmake-ninja
    build-options:
      env:
        GEM_PATH: /app/lib/ruby/gems/2.7.1
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DKEEPASSXC_DIST_TYPE=Flatpak
      - -DKEEPASSXC_BUILD_TYPE=Release
      - -DWITH_TESTS=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DWITH_XC_UPDATECHECK=OFF
      - -DWITH_XC_ALL=ON
    sources:
      - type: git
        url: https://github.com/keepassxreboot/keepassxc.git
        branch: develop
        commit: 02784b0eee44426d505227aec20db33720f4c2c7
    post-install:
      - install -Dm755 ./utils/keepassxc-flatpak-wrapper.sh /app/bin/keepassxc-wrapper
      - |
        for f in COPYING LICENSE*; do
          install -Dm644 $f /app/share/licenses/org.keepassxc.KeePassXC/$f
        done
    cleanup:
      - /share/man

    modules:
      - name: minizip
        subdir: contrib/minizip
        sources:
          - type: git
            url: 'https://github.com/madler/zlib'
            tag: 'v1.3.2'
            commit: da607da739fa6047df13e66a2af6b8bec7c2a498
          - type: patch
            path: minizip-ints-h.patch
          - type: script
            dest: contrib/minizip/
            dest-filename: autogen.sh
            commands:
              - autoreconf -ifv

      - name: botan
        buildsystem: simple
        build-commands:
          - "python3 ./configure.py \
              --disable-cc-tests \
              --disable-static-library \
              --prefix=/app \
              --with-zlib \
              --without-documentation"
          - make -j${FLATPAK_BUILDER_N_JOBS}
          - make install
        sources:
          - type: git
            url: https://github.com/randombit/botan.git
            tag: 3.12.0
            commit: 45d6f286c320b2f2efd5373d195ec88c367e3071
        post-install:
          - install -Dm644 -t /app/share/licenses/botan license.txt

      - name: pcsclite
        config-opts:
          - --sbindir=/app/bin
          - --disable-polkit
        sources:
          - type: git
            url: https://github.com/LudovicRousseau/PCSC
            tag: 2.4.1
            commit: 5a96d5b1c6a3658c581a793d01f6a00e1a44e360
        cleanup:
          - /bin
        post-install:
          - install -Dm644 -t /app/share/licenses/pcsclite COPYING

      - name: asciidoctor
        buildsystem: simple
        build-commands:
          - gem install --ignore-dependencies --no-user-install --verbose --local
                        --install-dir /app/lib/ruby/gems/2.7.1 --bindir /app/bin
                        asciidoctor-2.0.26.gem
        sources:
          - type: file
            url: https://rubygems.org/downloads/asciidoctor-2.0.26.gem
            sha256: 16e3accf1fc206bbd6335848649d7fd65f31d2daa60d85af13d47a8ee4b071c1
        cleanup:
          - '*'
        modules:
          - name: ruby
            sources:
              - type: archive
                url: https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.9.tar.gz
                sha256: 7bb4d4f5e807cc27251d14d9d6086d182c5b25875191e44ab15b709cd7a7dd9c
            cleanup:
              - '*'

      - name: keyutils
        buildsystem: simple
        build-commands:
          - make PREFIX='/app' SBINDIR='/app/bin' BINDIR='/app/bin' LIBDIR='/app/lib' USRLIBDIR='/app/lib' SHAREDIR='/app/share/keyutils' MANDIR='/app/share/man' INCLUDEDIR='/app/include' install
        sources:
          - type: git
            tag: v1.6.3
            url: https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git
